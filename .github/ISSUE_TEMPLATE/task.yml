name: Task or spec work
description: A concrete piece of work, including contributions to the NEAR Extents spec.
title: "[Task] "
labels: ["type:task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Platform
        - Treasury
        - Desk
        - near-agencies
        - private-ai
        - discovery
        - NEAR Extents
        - Vision / general
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when this is done?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, links, constraints
