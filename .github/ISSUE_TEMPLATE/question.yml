name: Question
description: Ask about the product, strategy or protocol design.
title: "[Question] "
labels: ["type:question"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Platform
        - Treasury
        - Desk
        - near-agencies
        - private-ai
        - discovery
        - NEAR Extents
        - Vision / general
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Anything you already tried or read.
